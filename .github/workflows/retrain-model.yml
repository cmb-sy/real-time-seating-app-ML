name: 機械学習モデル再訓練・自動更新

on:
  # 手動実行
  workflow_dispatch:
  # 毎週月曜日の午前2時に自動実行
  schedule:
    - cron: "0 2 * * 1"
  # データが更新された時（特定のファイルが変更された時）
  push:
    paths:
      - "src/ml/**"
      - "requirements.txt"

jobs:
  retrain-and-update:
    runs-on: ubuntu-latest

    # GitHub Actionsにプッシュ権限を付与
    permissions:
      contents: write
      actions: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKENを使用してプッシュ権限を確保
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python環境をセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 環境変数を設定
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> $GITHUB_ENV
          # SUPABASE_SERVICE_ROLE_KEYが設定されていればそれを使用、なければSUPABASE_SERVICE_ROLE_KEYを使用
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> $GITHUB_ENV
          elif [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> $GITHUB_ENV
          fi

      - name: 機械学習モデルを訓練
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python src/ml/train_ml_models.py --mode train

      - name: モデルファイルをAPIディレクトリにコピー
        run: |
          cp models/*.joblib src/api/

      - name: モデルファイルをコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/api/*.joblib
          if git diff --staged --quiet; then
            echo "モデルファイルに変更がありません"
          else
            git commit -m "🤖 自動モデル更新: $(date '+%Y-%m-%d %H:%M:%S')"
            # GITHUB_TOKENを使用してプッシュ
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
            echo "✅ モデルファイルを更新しました - Vercelが自動デプロイを開始します"
          fi

      - name: 完了通知
        run: |
          echo "## 🎯 モデル再訓練完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**実行日時**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**実行トリガー**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 更新されたファイル" >> $GITHUB_STEP_SUMMARY
          echo "- density_model.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- seats_model.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- best_params.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- model_performance.joblib" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 デプロイ状況" >> $GITHUB_STEP_SUMMARY
          echo "Vercelが自動的にデプロイを開始します" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏰ 次回実行予定" >> $GITHUB_STEP_SUMMARY
          echo "毎週月曜日 午前2時（UTC）" >> $GITHUB_STEP_SUMMARY
