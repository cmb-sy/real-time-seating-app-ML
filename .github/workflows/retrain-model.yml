name: 機械学習モデル更新

on:
  # 手動実行
  workflow_dispatch:
  # 隔週月曜日の午前2時に自動実行（第1・3週）
  schedule:
    - cron: "0 2 * * 1"
jobs:
  retrain-and-update:
    runs-on: ubuntu-latest

    # GitHub Actionsにプッシュ権限を付与
    permissions:
      contents: write
      actions: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKENを使用してプッシュ権限を確保
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 隔週実行チェック（定期実行時のみ）
        if: github.event_name == 'schedule'
        run: |
          # 月の第1・3週の月曜日のみ実行
          week_of_month=$(( ($(date +%d) - 1) / 7 + 1 ))
          if [ $week_of_month -eq 2 ] || [ $week_of_month -eq 4 ]; then
            echo "🚫 第${week_of_month}週です - 定期実行をスキップします"
            exit 78  # neutral exit code
          else
            echo "✅ 第${week_of_month}週です - 定期実行を継続します"
          fi

      - name: Python環境をセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r learn_requirements.txt

      - name: 環境変数を設定
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> $GITHUB_ENV

      - name: 機械学習モデルを訓練（既存ファイル上書き）
        run: |
          echo "🔄 既存の.joblibファイルを上書きしてモデルを訓練します"
          export PYTHONPATH=$GITHUB_WORKSPACE
          python utils/train.py --mode train

      - name: モデルファイルをコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "🤖 自動モデル更新: $(date '+%Y-%m-%d %H:%M:%S')" || echo "変更なし"
          # GITHUB_TOKENを使用してプッシュ
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }} || echo "プッシュ済み"
          echo "✅ モデルファイルを更新しました - Vercelが自動デプロイを開始します"

      - name: 完了通知
        run: |
          echo "## 🎯 モデル再訓練完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**実行日時**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**実行トリガー**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**実行ブランチ**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 更新されたファイル" >> $GITHUB_STEP_SUMMARY
          echo "**本番用API (api/)**:" >> $GITHUB_STEP_SUMMARY
          echo "- density_model.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- seats_model.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- best_params.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- model_performance.joblib" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 デプロイ状況" >> $GITHUB_STEP_SUMMARY
          echo "Vercelが自動的に本番環境にデプロイを開始します" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏰ 次回実行予定" >> $GITHUB_STEP_SUMMARY
          echo "隔週月曜日 午前2時（UTC）- 第1・3週のみ + 全pushイベント" >> $GITHUB_STEP_SUMMARY
