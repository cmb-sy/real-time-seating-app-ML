name: 🤖 機械学習モデル自動更新

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "強制再訓練（隔週チェックを無視）"
        required: false
        default: false
        type: boolean

  # 隔週月曜日の午前2時に自動実行（第1・3週）
  schedule:
    - cron: "0 2 * * 1"

env:
  PYTHON_VERSION: "3.11"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  retrain-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # GitHub Actionsにプッシュ権限を付与
    permissions:
      contents: write
      actions: read
      id-token: write

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 全履歴を取得（Git操作のため）

      - name: 📅 隔週実行チェック
        if: github.event_name == 'schedule' && !inputs.force_retrain
        id: schedule_check
        run: |
          week_of_month=$(( ($(date +%d) - 1) / 7 + 1 ))
          echo "current_week=${week_of_month}" >> $GITHUB_OUTPUT

          if [ $week_of_month -eq 2 ] || [ $week_of_month -eq 4 ]; then
            echo "🚫 第${week_of_month}週です - 定期実行をスキップします"
            echo "should_skip=true" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "✅ 第${week_of_month}週です - 定期実行を継続します"
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🛑 スケジュール実行スキップ
        if: steps.schedule_check.outputs.should_skip == 'true'
        run: |
          echo "## ⏭️ 実行スキップ" >> $GITHUB_STEP_SUMMARY
          echo "第${{ steps.schedule_check.outputs.current_week }}週のため実行をスキップしました" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: 🐍 Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡ uvをインストール
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 📋 uvキャッシュを設定
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: 🔧 Python仮想環境を作成
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: 📦 依存関係をインストール
        run: |
          echo "🔄 依存関係をインストール中..."
          uv sync --frozen --no-dev

          # インストール確認
          echo "📋 主要パッケージの確認:"
          uv pip list | grep -E "(scikit-learn|numpy|pandas|joblib|supabase)" || echo "パッケージ確認完了"

      - name: 🔐 環境変数を設定
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: 🔍 実行前のファイル状態確認
        run: |
          echo "## 📊 実行前のファイル状態" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "モデルファイル (utils/joblib/):" >> $GITHUB_STEP_SUMMARY
          if [ -d "utils/joblib" ]; then
            ls -la utils/joblib/*.joblib 2>/dev/null || echo "  .joblibファイルなし"
          else
            echo "  utils/joblibディレクトリが存在しません"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "予測ファイル (api/):" >> $GITHUB_STEP_SUMMARY
          if [ -d "api" ]; then
            ls -la api/*.json 2>/dev/null || echo "  .jsonファイルなし"
          else
            echo "  apiディレクトリが存在しません"
          fi
          echo "```" >> $GITHUB_STEP_SUMMARY

      - name: 📁 必要なディレクトリを作成
        run: |
          mkdir -p utils/joblib
          mkdir -p api
          echo "✅ 必要なディレクトリを作成しました"

      - name: 🤖 機械学習モデルを訓練
        id: training
        run: |
          echo "🔄 機械学習モデルの訓練を開始..."
          start_time=$(date +%s)

          # 高速化のため試行回数を100に設定
          python utils/train.py --mode train --n-trials 100

          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "training_duration=${duration}" >> $GITHUB_OUTPUT

          echo "✅ モデル訓練完了 (${duration}秒)"

      - name: 📊 予測データを生成
        id: prediction
        run: |
          echo "🔄 予測データの生成を開始..."
          start_time=$(date +%s)

          # 予測データ生成（JSONファイル作成）
          python utils/prediction.py

          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "prediction_duration=${duration}" >> $GITHUB_OUTPUT

          echo "✅ 予測データ生成完了 (${duration}秒)"

      - name: 🔍 生成後のファイル確認
        id: file_check
        run: |
          echo "🔍 生成後のファイル確認..."

          # モデルファイルの存在確認
          model_files_found=0
          expected_model_files=(
            "utils/joblib/density_model.joblib"
            "utils/joblib/seats_model.joblib"
            "utils/joblib/model_performance.joblib"
          )

          echo "### 📊 モデルファイル確認" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          for file in "${expected_model_files[@]}"; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
              echo "✅ $file (${size}bytes)" >> $GITHUB_STEP_SUMMARY
              model_files_found=$((model_files_found + 1))
            else
              echo "❌ $file が見つかりません" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "```" >> $GITHUB_STEP_SUMMARY

          # 予測JSONファイルの存在確認
          json_files_found=0
          expected_json_files=(
            "api/weekly_predictions.json"
            "api/weekly_averages.json"
            "api/last_update.json"
          )

          echo "### 📊 予測JSONファイル確認" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          for file in "${expected_json_files[@]}"; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
              echo "✅ $file (${size}bytes)" >> $GITHUB_STEP_SUMMARY
              json_files_found=$((json_files_found + 1))
            else
              echo "❌ $file が見つかりません" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "```" >> $GITHUB_STEP_SUMMARY

          echo "model_files_found=${model_files_found}" >> $GITHUB_OUTPUT
          echo "json_files_found=${json_files_found}" >> $GITHUB_OUTPUT
          echo "total_files_found=$((model_files_found + json_files_found))" >> $GITHUB_OUTPUT

          # 最低限必要なファイルが生成されているかチェック
          if [ $model_files_found -lt 3 ] || [ $json_files_found -lt 3 ]; then
            echo "⚠️ 必要なファイルが不足しています"
            echo "  モデルファイル: ${model_files_found}/3"
            echo "  予測JSONファイル: ${json_files_found}/3"
            exit 1
          fi

          echo "✅ 全ての必要ファイルが生成されました"

      - name: 📝 変更をコミット・プッシュ
        id: commit
        run: |
          # Git設定
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 全ての変更を確認
          git add -A

          # 変更確認
          if git diff --cached --quiet; then
            echo "📝 変更なし - コミットをスキップ"
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            # コミットメッセージ作成
            commit_msg="🤖 自動モデル更新: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              commit_msg="${commit_msg} [手動実行]"
            else
              commit_msg="${commit_msg} [自動実行]"
            fi
            
            # 変更ファイル数を追加
            total_files="${{ steps.file_check.outputs.total_files_found || '0' }}"
            commit_msg="${commit_msg} - ${total_files}ファイル更新"
            
            # コミット・プッシュ
            git commit -m "$commit_msg"
            git push
            
            echo "✅ 変更をコミット・プッシュしました"
            echo "changes_made=true" >> $GITHUB_OUTPUT
            echo "commit_message=$commit_msg" >> $GITHUB_OUTPUT
          fi

      - name: 🎯 実行結果サマリー
        if: always()
        run: |
          echo "## 🎯 モデル学習・予測更新結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📅 実行日時**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**🚀 実行トリガー**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**🌿 実行ブランチ**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**⏱️ 訓練時間**: ${{ steps.training.outputs.training_duration || '不明' }}秒" >> $GITHUB_STEP_SUMMARY
          echo "**⏱️ 予測時間**: ${{ steps.prediction.outputs.prediction_duration || '不明' }}秒" >> $GITHUB_STEP_SUMMARY
          echo "**📦 モデルファイル**: ${{ steps.file_check.outputs.model_files_found || '0' }}/3" >> $GITHUB_STEP_SUMMARY
          echo "**📊 予測JSONファイル**: ${{ steps.file_check.outputs.json_files_found || '0' }}/3" >> $GITHUB_STEP_SUMMARY
          echo "**✨ 変更有無**: ${{ steps.commit.outputs.changes_made == 'true' && '変更あり' || '変更なし' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.commit.outputs.changes_made }}" = "true" ]; then
            echo "### 📦 コミットメッセージ" >> $GITHUB_STEP_SUMMARY
            echo "\`${{ steps.commit.outputs.commit_message }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎉 更新完了" >> $GITHUB_STEP_SUMMARY
            echo "新しいモデルと予測データが本番環境に反映されました。" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ 変更なし" >> $GITHUB_STEP_SUMMARY
            echo "モデルファイルや予測データに変更はありませんでした。" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ❌ 失敗時の詳細ログ
        if: failure()
        run: |
          echo "## ❌ 実行失敗の詳細" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 ディレクトリ構造" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "utils/joblib/:" >> $GITHUB_STEP_SUMMARY
          ls -la utils/joblib/ 2>/dev/null || echo "  ディレクトリなし" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "api/:" >> $GITHUB_STEP_SUMMARY
          ls -la api/ 2>/dev/null || echo "  ディレクトリなし" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🐛 Python環境" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "Python Version: $(python --version 2>&1)" >> $GITHUB_STEP_SUMMARY
          echo "Working Directory: $(pwd)" >> $GITHUB_STEP_SUMMARY
          echo "PYTHONPATH: $PYTHONPATH" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
