name: 🤖 機械学習モデル自動更新

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "強制再訓練（隔週チェックを無視）"
        required: false
        default: false
        type: boolean

  # 隔週月曜日の午前2時に自動実行（第1・3週）
  schedule:
    - cron: "0 2 * * 1"

env:
  PYTHON_VERSION: "3.11"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  retrain-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub Actionsにプッシュ権限を付与
    permissions:
      contents: write
      actions: read
      id-token: write

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 全履歴を取得（Git操作のため）

      - name: 📅 隔週実行チェック
        if: github.event_name == 'schedule' && !inputs.force_retrain
        id: schedule_check
        run: |
          week_of_month=$(( ($(date +%d) - 1) / 7 + 1 ))
          echo "current_week=${week_of_month}" >> $GITHUB_OUTPUT

          if [ $week_of_month -eq 2 ] || [ $week_of_month -eq 4 ]; then
            echo "🚫 第${week_of_month}週です - 定期実行をスキップします"
            echo "should_skip=true" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "✅ 第${week_of_month}週です - 定期実行を継続します"
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🛑 スケジュール実行スキップ
        if: steps.schedule_check.outputs.should_skip == 'true'
        run: |
          echo "## ⏭️ 実行スキップ" >> $GITHUB_STEP_SUMMARY
          echo "第${{ steps.schedule_check.outputs.current_week }}週のため実行をスキップしました" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: 🐍 Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡ uvをインストール
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 📋 uvキャッシュを設定
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: 🔧 Python仮想環境を作成
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: 📦 依存関係をインストール
        run: |
          echo "🔄 依存関係をインストール中..."
          uv sync --frozen --no-dev

          # インストール確認
          echo "📋 主要パッケージの確認:"
          uv pip list | grep -E "(scikit-learn|numpy|pandas|joblib|supabase)"

      - name: 🔐 環境変数を設定
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: 🔍 実行前のファイル状態確認
        run: |
          echo "## 📊 実行前のモデルファイル状態" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "APIディレクトリ (api/):" >> $GITHUB_STEP_SUMMARY
          if [ -d "api" ]; then
            ls -la api/*.joblib 2>/dev/null || echo "  .joblibファイルなし"
          else
            echo "  apiディレクトリが存在しません"
          fi
          echo "```" >> $GITHUB_STEP_SUMMARY

      - name: 🤖 機械学習モデルを訓練
        id: training
        run: |
          echo "🔄 機械学習モデルの訓練を開始..."
          start_time=$(date +%s)

          # 訓練実行
          python utils/train.py --mode train

          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "training_duration=${duration}" >> $GITHUB_OUTPUT

          echo "✅ モデル訓練完了 (${duration}秒)"

      - name: 📊 訓練後のファイル確認
        id: file_check
        run: |
          echo "🔍 訓練後のファイル確認..."

          # モデルファイルの存在確認
          model_files_found=0
          for file in api/density_model.joblib api/seats_model.joblib api/best_params.joblib api/model_performance.joblib; do
            if [ -f "$file" ]; then
              size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "不明")
              echo "✅ $file (${size} bytes)"
              model_files_found=$((model_files_found + 1))
            else
              echo "❌ $file が見つかりません"
            fi
          done

          echo "found_files=${model_files_found}" >> $GITHUB_OUTPUT

          if [ $model_files_found -eq 0 ]; then
            echo "⚠️ モデルファイルが生成されませんでした"
            exit 1
          fi

      - name: 📝 変更をコミット・プッシュ
        id: commit
        run: |
          # Git設定
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 変更確認
          if git diff --quiet && git diff --staged --quiet; then
            echo "📝 変更なし - コミットをスキップ"
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            # 変更をステージング
            git add api/*.joblib 2>/dev/null || true
            git add . 2>/dev/null || true
            
            # コミットメッセージ作成
            commit_msg="🤖 自動モデル更新: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              commit_msg="${commit_msg} [手動実行]"
            else
              commit_msg="${commit_msg} [自動実行]"
            fi
            
            # コミット・プッシュ
            git commit -m "$commit_msg"
            git push
            
            echo "✅ 変更をコミット・プッシュしました"
            echo "changes_made=true" >> $GITHUB_OUTPUT
            echo "commit_message=$commit_msg" >> $GITHUB_OUTPUT
          fi

      - name: 🎯 実行結果サマリー
        if: always()
        run: |
          echo "## 🎯 モデル再訓練結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📅 実行日時**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**🚀 実行トリガー**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**🌿 実行ブランチ**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**⏱️ 訓練時間**: ${{ steps.training.outputs.training_duration || '不明' }}秒" >> $GITHUB_STEP_SUMMARY
          echo "**📦 生成ファイル数**: ${{ steps.file_check.outputs.found_files || '0' }}/4" >> $GITHUB_STEP_SUMMARY
          echo "**✨ 変更有無**: ${{ steps.commit.outputs.changes_made == 'true' && '変更あり' || '変更なし' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.commit.outputs.changes_made }}" = "true" ]; then
            echo "### 📦 更新されたファイル" >> $GITHUB_STEP_SUMMARY
            echo "**本番用API (api/)**:" >> $GITHUB_STEP_SUMMARY
            echo "
