name: Model Retraining

on:
  schedule:
    # 隔週の日曜日 午前2時（UTC）に実行
    - cron: "0 2 * * 0"
  workflow_dispatch: # 手動実行も可能

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> $GITHUB_ENV

      - name: Run data analysis
        run: |
          python -c "
          import sys
          sys.path.append('.')
          from src.ml.data_analysis import DataAnalyzer

          analyzer = DataAnalyzer()
          analyzer.load_data_from_supabase()
          stats = analyzer.get_basic_statistics()
          print(f'データ件数: {stats[\"全体統計\"][\"レコード数\"]}')
          print(f'平日データ件数: {stats[\"平日統計\"][\"レコード数\"]}')
          "

      - name: Retrain ML models
        run: |
          python -c "
          import sys
          sys.path.append('.')
          from src.ml.train_ml_models import run_full_ml_pipeline

          # 機械学習パイプライン全体を実行
          success = run_full_ml_pipeline(n_trials=30, target_type='both')
          if success:
              print('✅ モデルの再学習が完了しました')
          else:
              print('❌ モデルの再学習に失敗しました')
              exit(1)
          "

      - name: Check model files
        run: |
          echo "モデルファイルの確認:"
          if [ -d "src/models" ]; then
            ls -la src/models/
            echo "- density_model.joblib: $(ls -lh src/models/density_model.joblib 2>/dev/null || echo '見つかりません')"
            echo "- seats_model.joblib: $(ls -lh src/models/seats_model.joblib 2>/dev/null || echo '見つかりません')"
            echo "- best_params.joblib: $(ls -lh src/models/best_params.joblib 2>/dev/null || echo '見つかりません')"
            echo "- model_performance.joblib: $(ls -lh src/models/model_performance.joblib 2>/dev/null || echo '見つかりません')"
          else
            echo "src/models ディレクトリが見つかりません"
          fi

      - name: Copy models to API directory
        run: |
          mkdir -p src/api/
          if [ -d "src/models" ] && [ "$(ls -A src/models/*.joblib 2>/dev/null)" ]; then
            cp src/models/*.joblib src/api/
            echo "モデルファイルをAPIディレクトリにコピーしました:"
            ls -la src/api/*.joblib
          else
            echo "コピーするモデルファイルが見つかりません"
            exit 1
          fi

      - name: Test model predictions
        run: |
          python -c "
          import sys
          sys.path.append('.')
          from src.ml.train_ml_models import test_predictions

          # 予測テストを実行
          success = test_predictions()
          if success:
              print('✅ 予測テストが完了しました')
          else:
              print('❌ 予測テストに失敗しました')
              exit(1)
          "

      - name: Commit and push updated models
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 変更があるかチェック
          git add src/models/*.joblib src/api/*.joblib 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "モデルファイルに変更がありません"
          else
            git commit -m "🤖 自動モデル再学習 - $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "モデルファイルを更新しました"
          fi

      - name: Create deployment comment
        run: |
          echo "## モデル再学習完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**実行日時**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**実行トリガー**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 更新されたファイル" >> $GITHUB_STEP_SUMMARY
          echo "- density_model.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- seats_model.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- best_params.joblib" >> $GITHUB_STEP_SUMMARY
          echo "- model_performance.joblib" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 次回実行予定" >> $GITHUB_STEP_SUMMARY
          echo "隔週の日曜日 午前2時（UTC）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 手動実行" >> $GITHUB_STEP_SUMMARY
          echo "GitHub ActionsのWorkflowページから手動実行も可能です。" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## モデル再学習失敗" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**実行日時**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**エラー**: モデルの再学習中にエラーが発生しました" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "詳細はワークフローのログを確認してください。" >> $GITHUB_STEP_SUMMARY
